<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: #151515;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        font-family: Arial, sans-serif;
      }

      .calculator {
        background: #222;
        padding: 25px;
        border-radius: 20px;
        width: 320px;
        box-shadow: 0 10px 30px #0008;
      }

      #display {
        width: 100%;
        height: 80px;
        background: #333;
        border: none;
        outline: none;
        color: white;
        font-size: 35px;
        text-align: right;
        padding: 15px;
        border-radius: 10px;
        margin-bottom: 20px;
      }

      .buttons {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
      }

      button {
        height: 60px;
        border: none;
        border-radius: 12px;
        background: #444;
        color: white;
        font-size: 22px;
        cursor: pointer;
      }

      button:hover {
        background: #666;
      }

      .operator {
        background: #ff9500;
      }

      .operator:hover {
        background: #e68a00;
      }

      .clear {
        background: #e74c3c;
      }

      .equal {
        background: #2196f3;
        grid-column: span 2;
      }
    </style>
  </head>

  <body>
    <div class="calculator">
      <input type="text" id="display" value="0" readonly />

      <div class="buttons">
        <button class="clear" onclick="clearDisplay()">AC</button>
        <button onclick="deleteLast()">DEL</button>
        <button class="operator" onclick="chooseOperator('/')">÷</button>
        <button class="operator" onclick="chooseOperator('*')">×</button>

        <button onclick="appendNumber('7')">7</button>
        <button onclick="appendNumber('8')">8</button>
        <button onclick="appendNumber('9')">9</button>
        <button class="operator" onclick="chooseOperator('-')">-</button>

        <button onclick="appendNumber('4')">4</button>
        <button onclick="appendNumber('5')">5</button>
        <button onclick="appendNumber('6')">6</button>
        <button class="operator" onclick="chooseOperator('+')">+</button>

        <button onclick="appendNumber('1')">1</button>
        <button onclick="appendNumber('2')">2</button>
        <button onclick="appendNumber('3')">3</button>
        <button onclick="appendNumber('.')">.</button>

        <button onclick="appendNumber('0')">0</button>
        <button class="equal" onclick="calculate()">=</button>
      </div>
    </div>

    <script>
      const display = document.getElementById("display");

      let currentNumber = "0";
      let previousNumber = "";
      let operator = null;
      let shouldReset = false;

      function updateDisplay() {
        display.value = currentNumber;
      }

      function appendNumber(number) {
        if (shouldReset) {
          currentNumber = "0";
          shouldReset = false;
        }

        if (number === "." && currentNumber.includes(".")) return;

        if (currentNumber === "0" && number !== ".") {
          currentNumber = number;
        } else {
          currentNumber += number;
        }

        updateDisplay();
      }

      function chooseOperator(op) {
        if (operator !== null) {
          calculate();
        }

        previousNumber = currentNumber;
        operator = op;
        shouldReset = true;
      }

      function calculate() {
        if (operator === null || shouldReset) return;

        const a = Number(previousNumber);
        const b = Number(currentNumber);

        let result;

        switch (operator) {
          case "+":
            result = a + b;
            break;

          case "-":
            result = a - b;
            break;

          case "*":
            result = a * b;
            break;

          case "/":
            if (b === 0) {
              currentNumber = "Error";
              operator = null;
              shouldReset = true;
              updateDisplay();
              return;
            }
            result = a / b;
            break;
        }

        currentNumber = String(Number(result.toPrecision(12)));
        operator = null;
        previousNumber = "";
        shouldReset = true;

        updateDisplay();
      }

      function clearDisplay() {
        currentNumber = "0";
        previousNumber = "";
        operator = null;
        shouldReset = false;
        updateDisplay();
      }
    </script>
  </body>
</html>
